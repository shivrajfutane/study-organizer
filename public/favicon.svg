<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ss-lime-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FF62" />
      <stop offset="100%" stop-color="#63D6C5" />
    </linearGradient>
    <linearGradient id="ss-teal-lime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63D6C5" />
      <stop offset="100%" stop-color="#D6FF62" />
    </linearGradient>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2029" />
      <stop offset="100%" stop-color="#0F1217" />
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ss-bg)" stroke="#272E38" stroke-width="1.5" />

  <!-- Orbital Focus Rings -->
  <ellipse cx="32" cy="32" rx="23" ry="10" stroke="#63D6C5" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.35" transform="rotate(-25 32 32)" />
  
  <!-- Outer Cosmic Geometric S Wings -->
  <!-- Upper Wing (Lime -> Teal) -->
  <path
    d="M 44 14
       C 33 13, 19 16, 17 25
       C 15 32, 26 33, 34 35
       C 39 36, 43 38, 42 43
       C 41 49, 32 50, 24 49
       L 23 44
       C 29 45, 36 45, 37 41
       C 38 37, 31 35, 23 33
       C 14 31, 10 24, 12 17
       C 15 8, 30 7, 44 9
       Z"
    fill="url(#ss-lime-teal)"
    filter="url(#ss-glow)"
  />

  <!-- Bottom Accent / Reflected Geometric Counterpart -->
  <path
    d="M 21 50
       C 31 51, 45 48, 47 39
       C 48 34, 42 32, 35 30
       L 36 26
       C 45 28, 53 31, 52 40
       C 50 51, 33 55, 20 54
       Z"
    fill="url(#ss-teal-lime)"
    opacity="0.85"
  />

  <!-- Central Star of Focus (Spark of Mastery) -->
  <path
    d="M 32 23
       Q 32 29 38 29
       Q 32 29 32 35
       Q 32 29 26 29
       Q 32 29 32 23
       Z"
    fill="#FFFFFF"
  />
  <circle cx="32" cy="29" r="1.5" fill="#D6FF62" />

  <!-- Orbit Satellites -->
  <circle cx="49" cy="23" r="2" fill="#D6FF62" />
  <circle cx="15" cy="41" r="1.5" fill="#63D6C5" />
</svg>