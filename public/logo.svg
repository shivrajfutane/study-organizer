<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="logo-lime-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6FF62" />
      <stop offset="100%" stop-color="#63D6C5" />
    </linearGradient>
    <linearGradient id="logo-teal-lime" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63D6C5" />
      <stop offset="100%" stop-color="#D6FF62" />
    </linearGradient>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2029" />
      <stop offset="100%" stop-color="#0F1217" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mark Container Squircle (64x64 on left) -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#logo-bg)" stroke="#272E38" stroke-width="1.5" />
    
    <!-- Orbital Dash -->
    <ellipse cx="28" cy="28" rx="20" ry="8" stroke="#63D6C5" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" transform="rotate(-25 28 28)" />

    <!-- Upper Wing -->
    <path
      d="M 39 12
         C 29 11, 16 14, 15 22
         C 13 28, 23 29, 30 31
         C 34 32, 38 34, 37 38
         C 36 43, 28 44, 21 43
         L 20 39
         C 26 40, 32 40, 33 36
         C 34 33, 27 31, 20 29
         C 12 27, 9 21, 10 15
         C 13 7, 26 6, 39 8
         Z"
      fill="url(#logo-lime-teal)"
      filter="url(#logo-glow)"
    />

    <!-- Lower Wing -->
    <path
      d="M 18 44
         C 27 45, 39 42, 41 34
         C 42 30, 37 28, 31 26
         L 32 23
         C 40 25, 47 27, 46 35
         C 44 45, 29 48, 17 48
         Z"
      fill="url(#logo-teal-lime)"
      opacity="0.85"
    />

    <!-- Star Nexus -->
    <path
      d="M 28 20
         Q 28 25 33 25
         Q 28 25 28 30
         Q 28 25 23 25
         Q 28 25 28 20
         Z"
      fill="#FFFFFF"
    />
    <circle cx="28" cy="25" r="1.2" fill="#D6FF62" />

    <!-- Satellite dots -->
    <circle cx="43" cy="20" r="1.8" fill="#D6FF62" />
    <circle cx="13" cy="36" r="1.4" fill="#63D6C5" />
  </g>

  <!-- Typography Lockup -->
  <g transform="translate(74, 38)">
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#F3F5F7" letter-spacing="-0.5">Study<tspan fill="#D6FF62">Space</tspan></text>
    <text y="14" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#929BA8" letter-spacing="1.5">FOCUS WORKSPACE</text>
  </g>
</svg>
